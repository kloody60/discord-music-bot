<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>الإعدادات</title>
<style>
:root{--bg:#0f1115;--card:#181b22;--line:#262a34;--fg:#e8eaf0;--mut:#8b91a0;--acc:#5865f2;--ok:#3ba55d;--bad:#ed4245}
*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--fg);font-family:"Segoe UI",Tahoma,sans-serif;display:grid;place-items:center;min-height:100vh}
.box{width:min(520px,92vw)}h1{font-size:22px;margin:0 0 4px}.mut{color:var(--mut);font-size:13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px;margin-top:14px}
.step{display:flex;gap:8px;align-items:center;margin-bottom:8px;font-weight:600}
input,button{font:inherit;color:var(--fg);background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:10px 12px;width:100%}
button{cursor:pointer;width:auto}button.p{background:var(--acc);border-color:var(--acc);color:#fff}button:disabled{opacity:.5}
.row{display:flex;gap:8px}.row input{flex:1}.ok{color:var(--ok)}.bad{color:var(--bad)}
a{color:var(--acc)}.hide{display:none}
</style></head><body><div class="box">
<h1>🎵 بوت الموسيقى</h1><div class="mut">إعداد سريع، مرة وحدة بس.</div>

<div class="card"><div class="step"><span id="s1">①</span> توكن البوت</div>
<div class="mut" style="margin-bottom:8px">من <a href="https://discord.com/developers/applications" target="_blank">discord.com/developers</a> ← تطبيقك ← Bot ← Reset Token. لا تشاركه مع أحد.</div>
<div id="conn" class="hide" style="margin-bottom:8px"><span class="ok" id="connText"></span> <button onclick="document.getElementById('tokrow').classList.remove('hide');this.remove()">تغيير التوكن</button></div>
<div class="row" id="tokrow"><input id="token" type="password" placeholder="الصق التوكن هنا" autocomplete="off"><button class="p" id="go">حفظ وتشغيل</button></div>
<div id="msg" class="mut" style="margin-top:8px"></div>
<div class="mut" style="margin-top:6px">تدخله مرة وحدة بس، والبرنامج يحفظه ويفتح اللوحة تلقائي كل مرة.</div></div>

<div class="card"><div class="step"><span id="s2">②</span> أداة التحميل (yt-dlp)</div>
<div class="mut" style="margin-bottom:8px">تنزل وتتحدّث تلقائيا، ما تحتاج تسوي شيء. (الزر تحت لو تبي تحدّثها الحين.)</div>
<div class="row" style="align-items:center"><button id="dl">🔄 تحديث الآن</button><span id="dlmsg" class="mut"></span></div></div>

<div class="card row" style="align-items:center;justify-content:space-between">
<span class="mut" id="status"></span><span><button id="dash">فتح اللوحة</button> <button id="folder">📁</button></span></div>
</div>
<script>
const $=id=>document.getElementById(id);
async function refresh(){
  const s=await app.state();
  $('s1').textContent=s.hasToken?'✅':'①';$('s2').textContent=s.hasYtdlp?'✅':'②';
  $('status').textContent=s.running?`البوت شغال: ${s.tag}`:'البوت غير شغال';
  $('dash').disabled=!s.running;
  if(s.hasToken&&s.running){$('conn').classList.remove('hide');$('connText').textContent=`✅ متصل: ${s.tag}`;$('tokrow').classList.add('hide')}
}
const urlErr=new URLSearchParams(location.search).get('err');
if(urlErr){$('msg').className='bad';$('msg').textContent='❌ '+urlErr}
$('go').onclick=async()=>{
  $('go').disabled=true;$('msg').className='mut';$('msg').textContent='جاري الاتصال...';
  const r=await app.saveToken($('token').value);
  if(r.error){$('msg').className='bad';$('msg').textContent='❌ '+r.error}
  else if(r.restart){$('msg').className='ok';$('msg').textContent='تم الحفظ — أعد تشغيل البرنامج لتطبيق التوكن الجديد'}
  $('go').disabled=false;refresh();
};
$('dl').onclick=async()=>{
  $('dl').disabled=true;$('dlmsg').className='mut';$('dlmsg').textContent='جاري التنزيل...';
  const r=await app.downloadYtdlp();
  $('dlmsg').className=r.error?'bad':'ok';$('dlmsg').textContent=r.error?'❌ '+r.error:'✅ تم';
  $('dl').disabled=false;refresh();
};
$('dash').onclick=()=>app.openDashboard();
$('folder').onclick=()=>app.openFolder();
refresh();
</script></body></html>
