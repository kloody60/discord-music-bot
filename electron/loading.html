<!doctype html>
<html lang="ar" dir="rtl"><head><meta charset="utf-8"><title>بوت الموسيقى</title>
<style>
*{box-sizing:border-box;margin:0}
body{background:#07090d;color:#eef0f6;font-family:"Segoe UI Variable Text","Segoe UI",Tahoma,sans-serif;height:100vh;display:grid;place-items:center;text-align:center;overflow:hidden;
 background-image:radial-gradient(800px 480px at 80% -10%,rgba(34,211,238,.14),transparent 60%),radial-gradient(800px 480px at 0% 110%,rgba(244,114,182,.12),transparent 60%)}
.tb{position:fixed;top:0;left:0;right:0;height:40px;-webkit-app-region:drag}
.logo{width:96px;height:96px;margin:0 auto 22px;border-radius:28px;background:#0f1115;border:1px solid rgba(255,255,255,.13);display:grid;place-items:center;box-shadow:0 20px 60px rgba(34,211,238,.18)}
.bars{display:flex;gap:6px;align-items:flex-end;height:50px}
.bars i{width:8px;border-radius:5px;animation:b 1s ease-in-out infinite}
.bars i:nth-child(odd){background:#22d3ee}.bars i:nth-child(even){background:#f472b6}
.bars i:nth-child(2){animation-delay:.12s}.bars i:nth-child(3){animation-delay:.24s}.bars i:nth-child(4){animation-delay:.36s}.bars i:nth-child(5){animation-delay:.48s}.bars i:nth-child(6){animation-delay:.6s}
@keyframes b{0%,100%{height:14px}50%{height:48px}}
#m{color:#8a92a6;font-size:15px}
</style></head><body><div class="tb"></div>
<div><div class="logo"><div class="bars"><i></i><i></i><i></i><i></i><i></i><i></i></div></div><div id="m">جاري التحميل...</div></div>
<script>document.getElementById('m').textContent=new URLSearchParams(location.search).get('m')||'جاري التحميل...'</script>
</body></html>
